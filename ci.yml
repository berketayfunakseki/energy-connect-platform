name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: connect
          POSTGRES_PASSWORD: connect
          POSTGRES_DB: connect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connect -d connect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Apply PostgreSQL migration
        env:
          PGPASSWORD: connect
        run: psql -h localhost -U connect -d connect -f migrations/001_init.sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
